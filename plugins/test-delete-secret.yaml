apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: test-delete-secret
  title: Test - Delete a Vault secret
  description: Test template for vault:delete-secret action
spec:
  owner: test
  type: service
  parameters:
    - title: Provide secret path
      required:
        - path
      properties:
        path:
          title: Path
          type: string
          description: Path of the secret to delete (format mount/secret-name)
          default: secret/myapp
  steps:
    - id: delete-secret
      name: Delete secret from Vault
      action: vault:delete-secret
      input:
        path: ${{ parameters.path }}
  output:
    text:
      - title: 'Secret Deleted'
        content: |
          Successfully deleted secret at: ${{ parameters.path }}
