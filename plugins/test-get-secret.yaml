apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: test-get-secret
  title: Test - Get a Vault secret
  description: Test template for vault:get-secret action
spec:
  owner: test
  type: service
  parameters:
    - title: Provide secret path
      required:
        - path
      properties:
        path:
          title: Path
          type: string
          description: Path of the secret (format mount/secret-name)
          default: secret/myapp
  steps:
    - id: get-secret
      name: Get secret from Vault
      action: vault:get-secret
      input:
        path: ${{ parameters.path }}
  output:
    text:
      - title: 'Secret Retrieved'
        content: |
          Path: ${{ parameters.path }}
          Data: ${{ steps['get-secret'].output.data | dump }}
