apiVersion: rhdh.redhat.com/v1alpha2
kind: Backstage
metadata:
  name: rhdh-vault-test
  namespace: rhdh-vault-test
spec:
  application:
    # Debug image with sleep entrypoint
    # image: 'quay.io/dcurran/rhdh-debug:0.0.3'
    image: 'quay.io/rhdh-community/rhdh:next'

    replicas: 1

    appConfig:
      configMaps:
        - name: app-config-vault
        - name: dynamic-plugins-vault
      mountPath: /opt/app-root/src

    dynamicPluginsConfigMapName: dynamic-plugins-vault

    extraEnvs:
      envs:
        - name: NODE_OPTIONS
          value: '--no-node-snapshot'
        - name: NODE_ENV
          value: 'production'
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: '0'
      secrets:
        - name: rhdh-vault-secrets

  database:
    enableLocalDb: true
