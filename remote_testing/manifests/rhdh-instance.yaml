apiVersion: rhdh.redhat.com/v1alpha2
kind: Backstage
metadata:
  name: rhdh-vault-test
  namespace: rhdh-vault-test
spec:
  application:
    # IMPORTANT: Update this with your container image
    image: 'quay.io/YOUR_USERNAME/rhdh:vaultPlugin'
    imagePullPolicy: Always

    replicas: 1

    appConfig:
      configMaps:
        - name: app-config-vault
        - name: dynamic-plugins-vault
      mountPath: /opt/app-root/src

    dynamicPluginsConfigMapName: dynamic-plugins-vault

    extraEnvs:
      envs:
        - name: NODE_OPTIONS
          value: '--no-node-snapshot'
        - name: NODE_ENV
          value: 'production'
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: '0'
      secrets:
        - name: rhdh-vault-secrets
        - name: rhdh-github-secrets

    # Resource requests/limits
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi

  database:
    # For testing, use embedded PostgreSQL
    # For production, use external database
    enableLocalDb: true

  # Route configuration for OpenShift
  route:
    enabled: true
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
